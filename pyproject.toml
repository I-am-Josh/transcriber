[project]
name = "transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "parakeet-mlx>=0.7.0",
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
transcriber = "transcriber:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
